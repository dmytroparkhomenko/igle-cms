services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: igle
      POSTGRES_USER: igle
      POSTGRES_PASSWORD: igle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env.example
    environment:
      IGLE_DATA_DIR: /data
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - igle-data:/data

  preview:
    build:
      context: .
      dockerfile: docker/preview.Dockerfile
    env_file: .env.example
    environment:
      IGLE_DATA_DIR: /data
      PREVIEW_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - igle-data:/data

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env.example
    environment:
      IGLE_DATA_DIR: /data
    depends_on:
      - postgres
      - redis
    volumes:
      - igle-data:/data

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - preview

volumes:
  postgres-data:
  igle-data:
